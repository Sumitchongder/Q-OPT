name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.10" ]; then pip install -r requirements-py310.txt; else pip install -r requirements.txt; fi
          pip install -e . --no-deps
      - name: Unit + equivalence tests
        run: python -m pytest tests/ -q
      - name: Experiment smoke run (tiny seed counts)
        working-directory: experiments
        run: |
          python exp01_coupling_structure.py --n-seeds 2 --sizes 3 4 --loads 1.0
          python exp02_digital_twin.py --n-seeds 2 --n-epochs 3
          python exp04_ansatz_comparison.py --n-seeds 1 --p-xy 1 --p-pen 1
      - name: Rehearse the hardware notebook on FakeMarrakesh (no QPU)
        run: |
          pip install nbformat nbclient ipykernel
          python -m ipykernel install --user --name python3
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          nb = nbformat.read("notebooks/qpu_run.ipynb", as_version=4)
          for c in nb.cells:
              if c.cell_type == "code" and "SHOTS_REQUESTED" in c.source:
                  c.source = c.source.replace("SHOTS_REQUESTED  = 8192", "SHOTS_REQUESTED  = 1024")
          NotebookClient(nb, timeout=3600, kernel_name="python3", resources={"metadata": {"path": "notebooks"}}).execute()
          PY
