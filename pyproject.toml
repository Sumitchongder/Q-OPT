[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qopt"
version = "2.1.0"
description = "Q-OPT: coupled crypto-agility optimisation for QKD-PQC-QRNG networks with constraint-preserving QAOA"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Q-OPT authors" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "qiskit>=2.1",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.40",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
include = ["qopt*"]

[tool.pytest.ini_options]
# pytest maintains its own internal warning-capture context per test (it
# calls warnings.simplefilter("always") around each test item to build its
# warnings summary), which overrides any warnings.filterwarnings(...) call
# made in application code (e.g. qopt/__init__.py), that filter still
# correctly silences the warning for normal `python script.py` runs, but
# pytest needs its OWN filter configured here to respect the same
# suppression in `pytest -v` output and the warnings summary.
filterwarnings = [
    "ignore:.*NLocal.*deprecated.*:DeprecationWarning",
    "ignore:.*BlueprintCircuit.*deprecated.*:DeprecationWarning",
]
